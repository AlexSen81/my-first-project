<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ЯсеньStudio{% endblock %}</title>
    <!-- Здесь позже подключим стили, чтобы сайт был красивым -->
</head>
<body>

    <header style="background-color: #3e2723; color: white; padding: 20px; text-align: center;">
        <h1>🌳 Мастерская «ЯсеньStudio»</h1>
        <nav>
            <a href="#" style="color: white; margin: 0 10px; text-decoration: none;">Главная</a>
            <a href="#" style="color: white; margin: 0 10px; text-decoration: none;">Каталог</a>
            <a href="#" style="color: white; margin: 0 10px; text-decoration: none;">Контакты</a>
        </nav>
    </header>

    <main style="padding: 20px; min-height: 400px;">
        <!-- Сюда Django будет подставлять контент каждой отдельной страницы -->
        {% block content %}
        {% endblock %}
    </main>

    <footer style="background-color: #f5f5f5; text-align: center; padding: 15px; border-top: 1px solid #e0e0e0;">
        <p>&copy; 2026 ЯсеньStudio. Все права защищены. Изготовление изделий из дерева.</p>
    </footer>

</body>
</html>
